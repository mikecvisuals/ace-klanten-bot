yaml
name: Klanten aankondigen

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nieuwe klanten aankondigen
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          FORUM_CHANNEL_ID: ${{ secrets.FORUM_CHANNEL_ID }}
          ANNOUNCE_CHANNEL_ID: ${{ secrets.ANNOUNCE_CHANNEL_ID }}
          EDITOR_ROLE_ID: ${{ secrets.EDITOR_ROLE_ID }}
          MAX_AGE_HOURS: "24"
        run: python announce.py
